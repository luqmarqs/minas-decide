<!doctype html>
<html lang="pt-BR" data-brand="minas-decide">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6ece4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1f1c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Minas Decide: atlas eleitoral de Minas Gerais e agenda de atividades presenciais abertas à participação voluntária."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Minas Decide</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Identidade oficial: fontes de marca (OFL, self-hosted, subconjunto latino) do hero/lockup. -->
    <link
      rel="preload"
      href="/fonts/anton/Anton-Regular-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Imagem do LCP (hero): só aparece quando o React renderiza; pré-carregar (FE-10). -->
    <link
      rel="preload"
      as="image"
      href="/brand/minas-decide-hero-800.jpg"
      imagesrcset="/brand/minas-decide-hero-800.jpg 800w, /brand/minas-decide-hero-1600.jpg 1600w"
      imagesizes="(min-width: 1280px) 86vh, 100vw"
      fetchpriority="high"
    />
    <!-- Basemap (OpenFreeMap): open the connection early; the map itself starts after idle. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
