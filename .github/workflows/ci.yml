name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      # Fails the build if any legacy (SOURCE) identifier reaches client/worker/config.
      - run: npm run check:isolation
      - run: npm run data:validate
      - run: npm run build
      # Re-run isolation check against the built bundle too.
      - run: npm run check:isolation
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Database/RLS tests need TARGET dev credentials; they run only when secrets exist.
  db-tests:
    runs-on: ubuntu-latest
    if: ${{ secrets.SUPABASE_TARGET_URL != '' }}
    needs: verify
    env:
      SUPABASE_TARGET_URL: ${{ secrets.SUPABASE_TARGET_URL }}
      SUPABASE_TARGET_ANON_KEY: ${{ secrets.SUPABASE_TARGET_ANON_KEY }}
      SUPABASE_TARGET_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TARGET_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:db
